<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="512" rx="200" fill="url(#sheen)"/>

  <!-- as duas setas de TROCA (⇄): converter de um formato pra outro. Setas
       grossas pra sobreviver ao ícone de 32px. -->
  <g fill="#ffffff">
    <!-- seta de cima, apontando pra direita -->
    <path d="M300 402
             L604 402
             L604 344
             L732 446
             L604 548
             L604 490
             L300 490
             Z"/>
    <!-- seta de baixo, apontando pra esquerda -->
    <path d="M724 622
             L420 622
             L420 564
             L292 666
             L420 768
             L420 710
             L724 710
             Z"/>
  </g>

  <!-- assinatura da marca -->
  <text x="512" y="912" font-family="Segoe Script, cursive" font-size="80"
        fill="#ffffff" opacity="0.5" text-anchor="middle">Taylor</text>
</svg>
