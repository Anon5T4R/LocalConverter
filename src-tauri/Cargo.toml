[package]
name = "localconverter"
version = "0.3.5"
description = "LocalConverter — conversor universal de arquivos 100% offline"
authors = ["Taylor"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Anon5T4R/LocalConverter"

[lib]
# O sufixo `_lib` evita conflito entre o nome da lib e o do binário no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "localconverter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# CSD limpa: contorna a titlebar quebrada do tao <= 0.35 no GNOME/Wayland
# (ver lib.rs). Mesma versao que o tauri ja puxa. Sai junto com o upgrade ao tao 0.36.
gtk = "0.18"
